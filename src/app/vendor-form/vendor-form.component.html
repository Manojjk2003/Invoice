<div class="modal-overlay" *ngIf="isVisible">
  <div class="modal-content">
    <h2>{{ isEditMode ? 'Edit Vendor' : 'Add New Vendor' }}</h2>
    <form [formGroup]="vendorForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Vendor Name <span class="required">*</span></label>
        <input type="text" id="name" formControlName="name" class="form-control">
        <div *ngIf="name?.invalid && (name?.dirty || name?.touched)" class="text-danger">
          <small *ngIf="name?.errors?.['required']">Vendor name is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="contactPerson">Contact Person</label>
        <input type="text" id="contactPerson" formControlName="contactPerson" class="form-control">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" class="form-control">
        <div *ngIf="email?.invalid && (email?.dirty || email?.touched)" class="text-danger">
          <small *ngIf="email?.errors?.['email']">Invalid email format.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="phone">Phone (10 digits)</label>
        <input type="tel" id="phone" formControlName="phone" class="form-control">
        <div *ngIf="phone?.invalid && (phone?.dirty || phone?.touched)" class="text-danger">
          <small *ngIf="phone?.errors?.['pattern']">Phone number must be 10 digits.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="address">Address</label>
        <textarea id="address" formControlName="address" class="form-control"></textarea>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <textarea id="notes" formControlName="notes" class="form-control"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="vendorForm.invalid">
          {{ isEditMode ? 'Save Changes' : 'Add Vendor' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
