<div class="invoice-form">
  <h2>Create Invoice</h2>

  <form [formGroup]="invoiceForm">
    <!-- Logo upload -->
    <label for="logoUpload">Upload Logo</label>
    <input type="file" id="logoUpload" (change)="onLogoUpload($event)">

    <!-- Customer selection -->
    <select formControlName="customer">
      <option value="" disabled>Select a customer</option>
      <option *ngFor="let customer of customers" [value]="customer.id">{{ customer.name }}</option>
    </select>

    <button type="button" (click)="toggleNewCustomer()">Add New Customer</button>

    <!-- New Customer Fields (optional) -->
  <div *ngIf="showNewCustomer" [formGroup]="newCustomerForm">
  <h3>New Customer Details</h3>
  <input formControlName="name" placeholder="Name">
  <input formControlName="address" placeholder="Address">
  <input formControlName="gst" placeholder="GST Number">
  <input formControlName="contact" placeholder="Contact Number">
  <button type="button" (click)="saveNewCustomer()">Save Customer</button>
</div>


    <!-- Line items -->
    <div formArrayName="items">
      <div *ngFor="let item of items.controls; let i = index" [formGroupName]="i">
        <input formControlName="description" placeholder="Description">
        <input type="number" formControlName="amount" placeholder="Amount">
        <button type="button" (click)="removeItem(i)">Remove</button>
      </div>
    </div>
    <button type="button" (click)="addItem()">Add Item</button>

    <!-- Client Manager -->
    <label for="clientManager">Client Manager</label>
    <input formControlName="clientManager" placeholder="Client Manager">

    <!-- Calculations -->
    <div>
      <p>Subtotal: {{ subtotal }}</p>
      <p>GST (18%): {{ gst }}</p>
      <p>Total: {{ total }}</p>
      <p>Amount in Words: {{ amountInWords }}</p>
    </div>

    <button type="button" (click)="saveInvoice()">Save Invoice</button>
  </form>
</div>
