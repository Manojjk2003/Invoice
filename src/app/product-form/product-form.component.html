<div class="modal-overlay" *ngIf="isVisible">
  <div class="modal-content">
    <h2>{{ isEditMode ? 'Edit Product/Service' : 'Add New Product/Service' }}</h2>
    <form [formGroup]="productForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="name">Name <span class="required">*</span></label>
        <input type="text" id="name" formControlName="name" class="form-control">
        <div *ngIf="name?.invalid && (name?.dirty || name?.touched)" class="text-danger">
          <small *ngIf="name?.errors?.['required']">Name is required.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" class="form-control"></textarea>
      </div>

      <div class="form-group">
        <label for="defaultUnitPrice">Default Unit Price <span class="required">*</span></label>
        <input type="number" id="defaultUnitPrice" formControlName="defaultUnitPrice" class="form-control">
        <div *ngIf="defaultUnitPrice?.invalid && (defaultUnitPrice?.dirty || defaultUnitPrice?.touched)" class="text-danger">
          <small *ngIf="defaultUnitPrice?.errors?.['required']">Unit price is required.</small>
          <small *ngIf="defaultUnitPrice?.errors?.['min']">Unit price must be zero or positive.</small>
        </div>
      </div>

      <div class="form-group">
        <label for="defaultUnit">Default Unit (e.g., hour, item, kg)</label>
        <input type="text" id="defaultUnit" formControlName="defaultUnit" class="form-control">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="productForm.invalid">
          {{ isEditMode ? 'Save Changes' : 'Add Product' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
